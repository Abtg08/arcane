version: '3.9'

# Arcane — Local Development Infrastructure
# Run: pnpm infra:up

name: arcane-dev

services:
  # ─────────────────────────────────────────
  # PostgreSQL — primary durable state store
  # ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arcane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arcane
      POSTGRES_PASSWORD: arcane_dev_secret
      POSTGRES_DB: arcane
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arcane -d arcane']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # Valkey — ephemeral state (rate limits, OAuth, locks)
  # NOT authoritative business state
  # ─────────────────────────────────────────
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: arcane-valkey
    restart: unless-stopped
    command: valkey-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────
  # NATS JetStream — durable async messaging
  # Used for triggers, events, delivery, background work
  # NOT Postgres — Postgres is never the queue
  # ─────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: arcane-nats
    restart: unless-stopped
    command: >
      -js
      -m 8222
      -n arcane-nats
      --store_dir /data/jetstream
    ports:
      - '4222:4222'  # client
      - '8222:8222'  # monitoring
    volumes:
      - nats_data:/data/jetstream
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8222/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────
  # MinIO — S3-compatible object storage
  # Large payloads, artifacts, connector artifacts
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: arcane-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arcane_minio
      MINIO_ROOT_PASSWORD: arcane_minio_secret
    ports:
      - '9000:9000'  # S3 API
      - '9001:9001'  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # OpenTelemetry Collector
  # Receives traces/metrics/logs from all services
  # ─────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: arcane-otel
    restart: unless-stopped
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - '4317:4317'  # OTLP gRPC
      - '4318:4318'  # OTLP HTTP
      - '8888:8888'  # Prometheus metrics (self)
    depends_on:
      - tempo
      - loki
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:13133 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Tempo — distributed tracing backend
  # ─────────────────────────────────────────
  tempo:
    image: grafana/tempo:latest
    container_name: arcane-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo/config.yaml']
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - '3200:3200'  # Tempo HTTP API

  # ─────────────────────────────────────────
  # Loki — log aggregation
  # ─────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: arcane-loki
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - '3100:3100'

  # ─────────────────────────────────────────
  # Prometheus — metrics scraping
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: arcane-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/config.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./prometheus/config.yaml:/etc/prometheus/config.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'

  # ─────────────────────────────────────────
  # Grafana — dashboards (traces + metrics + logs)
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: arcane-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_FEATURE_TOGGLES_ENABLE: 'traceqlEditor'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres_data:
  nats_data:
  minio_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: arcane-dev
