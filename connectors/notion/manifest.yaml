id: notion
slug: notion
name: Notion
description: >
  Search, read, and write Notion pages, databases, and blocks.
version: "1.0.0"
category: productivity
icon_url: https://cdn.arcane.dev/connectors/notion/icon.svg

auth:
  type: oauth2
  oauth2:
    authorization_url: https://api.notion.com/v1/oauth/authorize
    token_url: https://api.notion.com/v1/oauth/token
    scopes: []
    pkce: false
    refresh_supported: false
  connect_hint: Connect your Notion workspace.

base_url: https://api.notion.com/v1
default_headers:
  Content-Type: application/json
  Notion-Version: "2022-06-28"
