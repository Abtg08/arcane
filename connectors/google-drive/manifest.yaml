id: google-drive
slug: google-drive
name: Google Drive
description: >
  Manage files and folders in Google Drive.
  Powers AI agents to organize, search, and manipulate Drive content.
version: "1.0.0"
category: storage
icon_url: https://cdn.arcane.dev/connectors/google-drive/icon.svg

auth:
  type: oauth2
  oauth2:
    authorization_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/drive.readonly
      - https://www.googleapis.com/auth/drive.file
    pkce: true
    refresh_supported: true
  connect_hint: Connect your Google account to access Google Drive files.

base_url: https://www.googleapis.com/drive/v3
default_headers:
  Content-Type: application/json
